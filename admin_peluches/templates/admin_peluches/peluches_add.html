{% extends "admin_peluches/base.html" %}
{% load static %}
{% block body %}
    <div class="container py-4">
        <h2 class="text-center mb-4">Formulario</h2>
        <form action="peluchesAdd" method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="row">
                <!-- Izquierda -->
                <div class="col-md-5 mb-3">
                    <div class="image-preview-box">
                        <h5>Imágenes</h5>
                        <div class="image-upload-box">
                            <input type="file" name="imagen" id="imagenesInput" multiple class="image-input">
                            <!-- Placeholder -->
                            <div id="placeholder" class="preview-placeholder">
                                📷 Arrastra o selecciona imágenes
                            </div>
                            <!-- Preview -->
                            <div id="preview" class="preview-grid"></div>
                        </div>
                    </div>
                </div>
                <!-- Derecha -->
                <div class="col-md-7">
                    <div class="form-box">
                        <label>Nombre</label>
                        <input type="text" name="nombre" class="form-control mb-2">
                        <label>Categoría</label>
                        <select name="categoria" class="form-select mb-2">
                            {% for categoria in categorias %}
                                <option value="{{categoria.id_categoria}}">
                                    {{categoria.categoria}}
                                </option>
                            {% endfor %}
                        </select>
                        <label>Precio</label>
                        <input type="text" name="precio" class="form-control mb-2">
                        <label>Descripción</label>
                        <textarea name="descripcion" rows="4" class="form-control mb-2"></textarea>
                        <label>Altura (cm)</label>
                        <input type="number" name="alto_cm" class="form-control mb-2" min="1">
                        <label>Ancho (cm)</label>
                        <input type="number" name="ancho_cm" class="form-control mb-2" min="1">
                        <label>Estado</label>
                        <select name="estado_revision" id="estado_revision" class="form-select mb-2">
                            {% for value, label in estado_choices %}
                                <option value="{{ value }}">{{ label }}</option>
                            {% endfor %}
                        </select>
                        <!-- ENTREGA -->
                        <div id="campos_entrega" style="display:none;">
                            <label>Fecha entrega</label>
                            <input type="datetime-local" name="fecha_entrega" class="form-control mb-2">
                            <label>Lugar entrega</label>
                            <input type="text" name="lugar_entrega" class="form-control mb-2">
                        </div>
                        <button type="submit" name="opcion" value="Agregar" class="btn btn-custom mt-3 w-100">
                            Agregar Peluche
                        </button>
                        <a href="{% url 'peluches_list' %}" class="d-block mt-3 text-center" style="text-decoration: none;">Volver</a>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <!-- Tiene JS de admin -->
{% endblock %}
