{% extends "admin_peluches/base.html" %}
{% load static %}
{% block body %}
    <!-- Calendario -->
    <div class="container py-4">
        <h2 class="text-center mb-4">📅 Calendario de Entregas</h2>
        <!-- CONTENEDOR ESTILIZADO -->
        <div class="form-box p-3">
            <div id="calendar"></div>
        </div>
    </div>
    <!-- MODAL -->
    <div class="modal fade" id="eventoModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitulo"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center">
                    <img id="modalImagen" src="" class="img-fluid rounded mb-3 shadow-sm" style="max-height: 250px; object-fit: cover;">
                    <p id="modalFecha" class="mb-1 fw-bold"></p>
                    <p id="modalLugar" class="text-muted"></p>
                </div>
                <div class="modal-footer d-flex gap-2 w-100">
                    <a id="btnVerPeluche" target="_blank" class="btn btn-primary flex-fill">
                        Ver Peluche
                    </a>
                    <form id="formEntregado" method="POST" class="flex-fill m-0">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-success w-100">
                            ✔ Marcar como entregado
                        </button>
                    </form>

                </div>
            </div>
        </div>
    </div>
{% endblock %}
