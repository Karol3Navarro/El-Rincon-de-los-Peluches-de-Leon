{% extends "admin_peluches/base.html" %}
{% load static %}
{% block body %}

    <h2 style="text-align:center;">📅 Calendario de Entregas</h2>

    <!-- FullCalendar CSS -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">

    <div id="calendar" style="max-width: 900px; margin: 40px auto;"></div>

    <div class="modal fade" id="eventoModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title" id="modalTitulo"></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body text-center">

                <img id="modalImagen" src="" class="img-fluid rounded mb-3">

                <p id="modalFecha"></p>
                <p id="modalLugar"></p>

            </div>
                <div class="modal-footer">
                    <form id="formEntregado" method="POST">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-success">
                            ✔ Marcar como entregado
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- FullCalendar JS -->
    {% block extra_js %}
        <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
        <script src="{% static 'js/scripts_admin.js' %}"></script>
    {% endblock %}


{% endblock %}
