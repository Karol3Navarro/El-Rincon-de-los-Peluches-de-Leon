{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Rincón de los Peluches de León</title>
    <link rel="stylesheet" href="{% static 'css/style_peluches.css' %}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.js"></script>
    {% block extra_head %}
    {% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'index' %}"><img src="{% static 'img/Logo.png' %}" alt="" height="50px" width="65px"></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="{% url 'index' %}">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="{% url 'peluches' %}">Peluches</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href='#'>Contacto</a>
                    </li>
                </ul>
                <form class="d-flex" role="search" method="get" action="{% url 'peluches' %}">
                    <input class="form-control me-2" type="search" placeholder="Buscar peluche..." aria-label="Search" name="q" value="{{ request.GET.q }}">
                    <button class="btn btn-outline-success" type="submit">Buscar</button>
                </form>
            </div>
        </div>
    </nav>

    {% block body %}
    {% endblock body %}
    <br>

    <footer class="footer">
        <div class="footer-social">
            <a href="https://www.instagram.com/rincondelospeluchesdeleon?igsh=ZWEzaWdzNXpxNDc0" aria-label="Instagram">
                <img src="{% static 'img/instagram.png' %}" alt="Instagram" width="40px">
            </a>
            <a href="https://www.tiktok.com/@rincondepeluchesdeleon?_r=1&_t=ZS-95SOsvbXmyb" aria-label="TikTok">
                <img src="{% static 'img/tik-tok.png' %}" alt="TikTok" width="40px">
            </a>
            <a href="#" aria-label="WhatsApp">
                <img src="{% static 'img/whatsapp.png' %}" alt="WhatsApp" width="40px">
            </a>
        </div>

        <p class="footer-text">© 2026 El Rincón de los Peluches de León. Todos los derechos reservados.</p>
    </footer>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="{% static 'js/scripts_peluches.js' %}" defer></script>
</body>
</html>
